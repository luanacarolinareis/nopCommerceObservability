global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrape metrics forwarded by the OTel Collector
  - job_name: nopcommerce_via_collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: nopcommerce
          source: otel_collector

  # Direct scrape from the locally running nopCommerce instance.
  # It remains configured for debugging, but may be down depending on how the
  # app is launched locally.
  - job_name: nopcommerce_direct
    static_configs:
      - targets: ["host.docker.internal:5000"]
        labels:
          service: nopcommerce
          source: direct_scrape
    metrics_path: /metrics
